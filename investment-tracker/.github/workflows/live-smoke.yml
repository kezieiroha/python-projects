name: Live Smoke

# The unit suite runs entirely offline, so it cannot catch a breaking yfinance
# release. This workflow hits the real provider with three tickers and asserts
# that prices and moving averages actually reach the workbook.
#
# Deliberately not on pull_request or push: it depends on a third-party service,
# so it must never gate an ordinary change. Run it after a dependency bump, and
# weekly so a silent provider break surfaces on its own.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'   # Mondays, 07:17 UTC

permissions:
  contents: read

jobs:
  live-smoke:
    name: Live Provider Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Live provider smoke
        run: python tests/live_smoke.py
